# Serves the built frontend and forwards the backend's routes, so that the whole
# app lives on a single origin and can sit behind one reverse proxy entry.
# TLS is terminated by that proxy, so everything here speaks plain HTTP.

# Carry the websocket upgrade through to the backend instead of dropping it here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Re-resolve the backend through Docker's DNS rather than caching its address
    # at startup, so recreating the backend container does not strand us on a
    # stale IP. proxy_pass then needs the address in a variable to honour this.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # The websocket carrying game state (SecretHitlerServer's /game handler).
    location = /game {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Games are long-lived and idle between moves. The client pings every 50s
        # (PING_INTERVAL), so an hour leaves plenty of slack.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The REST endpoints the backend exposes.
    location ~ ^/(check-login|new-lobby|open-lobbies|ping)$ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signing in with Slack. A prefix match rather than a list of paths, and ^~ so
    # it beats the single-page fallback below -- anything that reached that would be
    # answered with index.html and a 200, which looks like Slack returning HTML.
    location ^~ /auth/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness for the proxy in front of us; does not touch the backend.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Build assets carry a content hash in their name, so they never change.
    location /static/ {
        expires 1y;
    }

    # `expires -1` sends Cache-Control: no-cache, so clients pick up new builds.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
